<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLOWDROP</title><link rel="stylesheet" href="style.css">
<header><a href="./">FLOW<span>DROP</span></a><small>RHYTHM LAB / 01</small></header>
<main><section id="setup"><p class="label">LOCAL AUDIO / AUTO CHART</p><h1>Catch the<br><em>flow.</em></h1>
<p>Pick a track. Generate a chart. Play it on six keys.</p>
<label class="picker">Choose audio <input id="audio" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg"></label>
<label class="picker">Optional chart (.json) <input id="chartFile" type="file" accept=".json,application/json"></label><div class="settings"><label>Lane view <select id="view"><option value="perspective">Perspective</option><option value="vertical">Vertical</option></select></label><label>Difficulty <select id="difficulty"><option>Easy</option><option selected>Normal</option><option>Hard</option></select></label>
<label>Scroll speed <select id="speed"><option value="2.5">Slow</option><option value="1.8" selected>Normal</option><option value="1.2">Fast</option></select></label>
<label>Key sounds <select id="sounds"><option value="off">Off</option><option value="on">On</option></select></label><label>Timing offset (ms) <input id="offset" type="number" value="0" min="-250" max="250" step="5"></label></div>
<button id="start" disabled>Generate &amp; play</button><button id="save" disabled>Save chart</button><button id="demo" disabled>Try practice beat</button>
<p id="message" role="status">Game controls require JavaScript. If this message persists, open this file in a web browser.</p>
</section><section id="game" hidden><div class="hud"><span><button id="exit">Exit</button> <button id="replayGame">Replay</button></span><button id="saveGame">Save chart</button></div><canvas id="field" width="840" height="600" aria-label="Six-lane rhythm playfield"></canvas><dialog id="results" aria-labelledby="resultTitle">
<h2 id="resultTitle">Track complete</h2>
<div class="result-grid"><div><small>SCORE</small><strong id="finalScore"></strong></div><div><small>ACCURACY</small><strong id="accuracy"></strong></div></div>
<p id="result"></p><button id="replay">Replay</button> <button id="closeResults">Back to setup</button>
</dialog></section></main>
<footer><span>S / D / F</span><span>J / K / L</span></footer>
<script src="chart.js" defer></script>
<script src="game.js" defer></script></html>
